[theme]
base = "light"
primaryColor = "#0F766E"
backgroundColor = "#F7FAF9"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
linkColor = "#0F766E"
borderColor = "#D8E5E1"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Sora:https://fonts.googleapis.com/css2?family=Sora:wght@600;700&display=swap"
headingFontSizes = ["34px", "26px", "20px", "17px", "15px", "13px"]
headingFontWeights = [700, 700, 600, 600, 500, 500]
metricValueFontSize = "2rem"
metricValueFontWeight = 700
baseRadius = "large"
buttonRadius = "full"
showWidgetBorder = true
showSidebarBorder = false
paddingTop = "1.25rem"
paddingBottom = "2rem"

[theme.sidebar]
backgroundColor = "#0B2B2A"
secondaryBackgroundColor = "#123B39"
textColor = "#ECFDF5"
primaryColor = "#F59E0B"
borderColor = "#1F4D4A"
